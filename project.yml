name: MarkDownGo
options:
  bundleIdPrefix: com.sparkconch
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38"
  developmentLanguage: en

packages:
  SwiftCMark:
    url: https://github.com/swiftlang/swift-cmark
    from: 0.9.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
  # DEBUG guards the smoke hook; Release builds must not contain it.
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  MarkDownGoCore:
    type: framework
    platform: macOS
    sources:
      - path: MarkDownGo/Core
    dependencies:
      - package: SwiftCMark
        product: cmark-gfm
      - package: SwiftCMark
        product: cmark-gfm-extensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparkconch.MarkDownGo.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: NO

  MarkDownGo:
    type: application
    platform: macOS
    sources:
      - path: MarkDownGo/App
      - path: MarkDownGo/Resources
        excludes:
          - "preview/**"
          - "Themes/**"
      - path: MarkDownGo/Resources/preview
        type: folder
        buildPhase: resources
      - path: MarkDownGo/Resources/Themes
        type: folder
        buildPhase: resources
    dependencies:
      - target: MarkDownGoCore
      - target: MarkDownGoQuickLook
        embed: true
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparkconch.MarkDownGo
        PRODUCT_NAME: MarkDownGo
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MarkDownGo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "SparkConch"
        INFOPLIST_KEY_NSQuitAlwaysKeepsWindows: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        # App icon: supplied by the author (a hand-made 1024 PNG lands in the appiconset).
        # No ASSETCATALOG_COMPILER_APPICON_NAME until then — the app uses the system default icon.
        # Warnings are defects; keep the build honest (see SPEC §3 implementation notes).
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        # Compile with relative source paths so Swift metadata cannot embed /Users/<you>/...;
        # scripts/strip-and-sign.sh remains as the belt to this braces.
        OTHER_SWIFT_FLAGS: "$(inherited) -file-compilation-dir $(SRCROOT)"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: MarkDownGo/App/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        # The document type must carry NSDocumentClass, otherwise NSDocumentController has no
        # creatable class and "new document" fails. CFBundleTypeExtensions also catches .md files
        # that LaunchServices would otherwise resolve to another owner (e.g. the Sega ROM .md).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            NSDocumentClass: $(PRODUCT_MODULE_NAME).Document
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
            CFBundleTypeExtensions: [md, markdown, mdown, mkd, mkdn]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeDescription: Markdown Document
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: [text/markdown]

  MarkDownGoQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: MarkDownGo/QuickLook
        excludes:
          - "Info.plist"
      # Shared with the app so the Finder preview renders through exactly the same shell,
      # theme injection and custom scheme — no second implementation to drift.
      - path: MarkDownGo/App/PreviewScheme.swift
      - path: MarkDownGo/Resources/Themes
        type: folder
        buildPhase: resources
      - path: MarkDownGo/Resources/preview
        type: folder
        buildPhase: resources
    dependencies:
      - target: MarkDownGoCore
      - sdk: WebKit.framework
      - sdk: Quartz.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparkconch.MarkDownGo.quicklook
        PRODUCT_NAME: MarkDownGoQuickLook
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -file-compilation-dir $(SRCROOT)"
        # The extension's Info.plist is hand-written (NSExtension + QL attributes); xcodegen's
        # `info:` would regenerate it and drop the keys it doesn't model.
        INFOPLIST_FILE: MarkDownGo/QuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: MarkDownGo/QuickLook/MarkDownGoQuickLook.entitlements

  MarkDownGoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MarkDownGo/Tests
    dependencies:
      - target: MarkDownGoCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sparkconch.MarkDownGo.tests

schemes:
  MarkDownGo:
    build:
      targets:
        MarkDownGo: all
        MarkDownGoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MarkDownGoTests
